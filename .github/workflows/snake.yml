name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  # Rebuild straight away when the workflow, the scripts or the car photo change.
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/**"
      - "assets/car-top.jpg"

permissions:
  contents: write

# Never let two runs commit profile.svg at the same time.
concurrency:
  group: profile-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The snake becomes the Track map panel. Its colours are replaced by
      # scripts/dashboard.py (recolour_snake), so the colour flags here do not matter.
      # github.repository_owner always matches the current username, so a rename cannot break it.
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Draws dist/profile.svg: the whole mission-control dashboard.
      - name: Build profile image
        run: python3 scripts/build_panels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
          DISPLAY_TZ: Asia/Colombo

      # The README shows ./profile.svg from main. A file inside the repo is served
      # directly by GitHub, not through its image proxy (camo), so a new version
      # appears within minutes and the README never needs a ?v= bump again.
      - name: Commit profile.svg to main
        run: |
          cp dist/profile.svg profile.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg
          if git diff --cached --quiet; then
            echo "profile.svg unchanged"
          else
            git commit -m "Update profile.svg"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Kept as a backup copy of the generated files; the README no longer uses this branch.
      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
