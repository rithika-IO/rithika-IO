name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  # Rebuild straight away when the workflow, the script or its content changes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/**"
      - "assets/banner.png"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The snake is drawn on the Race Track section of the poster: red snake, grey-to-navy dots.
      # github.repository_owner always matches the current username, so a rename cannot break it again.
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=#B8343F&color_dots=#2A5AA6,#6F93D1,#A8C1EC,#E4ECFB,#D9B13B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Draws dist/profile.svg (the whole F1 poster, including live F1 standings).
      - name: Build themed panels
        run: python3 scripts/build_panels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
